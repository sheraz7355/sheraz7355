<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 216" width="480" height="216" role="img" aria-label="Always Answer: AI agents that answer calls, website chats and texts for businesses in Canada, around the clock.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151922"/><stop offset="1" stop-color="#10131A"/></linearGradient>
  <linearGradient id="agent" x1="0" x2="1"><stop offset="0" stop-color="#6E4FA8"/><stop offset="1" stop-color="#8462B8"/></linearGradient>
</defs>
<style>
  text { font-family: 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; }
  .blink { animation: blink 1.8s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  
  .bar { transform-box: fill-box; transform-origin: center; animation: wave 1.2s ease-in-out infinite; }
  @keyframes wave { 0%,100% { transform: scaleY(.45); } 50% { transform: scaleY(1); } }
</style>
<rect x="0.5" y="0.5" width="479" height="215" rx="14" fill="url(#bg)" stroke="#2A303C"/>

<clipPath id="round"><rect x="0.5" y="0.5" width="479" height="215" rx="14"/></clipPath>
<rect x="0" y="0" width="480" height="3" fill="#9B7BD0" fill-opacity="0.85" clip-path="url(#round)"/>
<rect x="28" y="28" width="52" height="52" rx="12" fill="#9B7BD0" fill-opacity="0.14" stroke="#9B7BD0" stroke-opacity="0.5"/>
<rect class="bar" x="40" y="50.5" width="3.5" height="7" rx="1.75" fill="#9B7BD0" style="animation-delay:0s"/><rect class="bar" x="46" y="46.3" width="3.5" height="15.399999999999999" rx="1.75" fill="#9B7BD0" style="animation-delay:0.12s"/><rect class="bar" x="52" y="43.5" width="3.5" height="21" rx="1.75" fill="#9B7BD0" style="animation-delay:0.24s"/><rect class="bar" x="58" y="47.7" width="3.5" height="12.6" rx="1.75" fill="#9B7BD0" style="animation-delay:0.36s"/><rect class="bar" x="64" y="44.9" width="3.5" height="18.2" rx="1.75" fill="#9B7BD0" style="animation-delay:0.48s"/>
<text x="98" y="47" font-size="11" font-weight="700" letter-spacing="1.5" fill="#9B7BD0">AI AGENTS  ·  VOICE  ·  CHAT</text>
<text x="98" y="75" font-size="24" font-weight="700" fill="#F2F4F8">Always Answer</text>

<text x="28" y="120" font-size="14.5" fill="#B4BAC6">AI agents that answer calls, website chats and</text>
<text x="28" y="143" font-size="14.5" fill="#B4BAC6">texts for businesses in Canada, around the clock.</text>
<rect x="28" y="164" width="213" height="28" rx="14" fill="#1B202A" stroke="#2A303C"/>
<circle class="blink" cx="45" cy="178" r="4" fill="#4ADE80"/>
<text x="58" y="182.5" font-size="12" font-weight="600" letter-spacing="0.5" fill="#D5D9E2">IN PRODUCTION  ·  private</text>
</svg>
