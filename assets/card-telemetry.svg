<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 216" width="480" height="216" role="img" aria-label="Telemetry Pro: A vehicle system that detects crashes and automatically alerts hospitals and ambulances.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151922"/><stop offset="1" stop-color="#10131A"/></linearGradient>
  <linearGradient id="agent" x1="0" x2="1"><stop offset="0" stop-color="#6E4FA8"/><stop offset="1" stop-color="#8462B8"/></linearGradient>
</defs>
<style>
  text { font-family: 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; }
  .blink { animation: blink 1.8s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  
  .bar { transform-box: fill-box; transform-origin: center; animation: wave 1.2s ease-in-out infinite; }
  @keyframes wave { 0%,100% { transform: scaleY(.45); } 50% { transform: scaleY(1); } }
</style>
<rect x="0.5" y="0.5" width="479" height="215" rx="14" fill="url(#bg)" stroke="#2A303C"/>

<clipPath id="round"><rect x="0.5" y="0.5" width="479" height="215" rx="14"/></clipPath>
<rect x="0" y="0" width="480" height="3" fill="#E35D6A" fill-opacity="0.85" clip-path="url(#round)"/>
<rect x="28" y="28" width="52" height="52" rx="12" fill="#E35D6A" fill-opacity="0.14" stroke="#E35D6A" stroke-opacity="0.5"/>
<path d="M36 55 h9 l4 -11 l6 22 l5 -14 l3 3 h11" fill="none" stroke="#E35D6A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="98" y="47" font-size="11" font-weight="700" letter-spacing="1.5" fill="#E35D6A">HARDWARE  ·  SAFETY</text>
<text x="98" y="75" font-size="24" font-weight="700" fill="#F2F4F8">Telemetry Pro</text>
<text x="452" y="48" font-size="18" text-anchor="end" fill="#8B93A3">&#8599;</text>
<text x="28" y="120" font-size="14.5" fill="#B4BAC6">A vehicle system that detects crashes and</text>
<text x="28" y="143" font-size="14.5" fill="#B4BAC6">automatically alerts hospitals and ambulances.</text>
<rect x="28" y="164" width="233" height="28" rx="14" fill="#1B202A" stroke="#2A303C"/>
<circle cx="45" cy="178" r="4" fill="#8B93A3"/>
<text x="58" y="182.5" font-size="12" font-weight="600" letter-spacing="0.5" fill="#D5D9E2">PROJECT  ·  source on GitHub</text>
</svg>
