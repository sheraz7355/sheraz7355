<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 216" width="480" height="216" role="img" aria-label="Telemetry Pro: A vehicle system that detects crashes and automatically alerts hospitals and ambulances.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171127"/><stop offset="1" stop-color="#0B0912"/></linearGradient>
  <radialGradient id="glow" cx="0.85" cy="0.05" r="0.75"><stop offset="0" stop-color="#E35D6A" stop-opacity="0.30"/><stop offset="1" stop-color="#E35D6A" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity="0.055"/></pattern>
  <linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#EBDDFF"/><stop offset="1" stop-color="#9B7BD0"/></linearGradient>
  <linearGradient id="agent" x1="0" x2="1"><stop offset="0" stop-color="#6E47A6"/><stop offset="1" stop-color="#8F63A7"/></linearGradient>
</defs>
<style>
  text { font-family: 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; }
  .blink { animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  
  .bar { transform-box: fill-box; transform-origin: center; animation: wave 1.2s ease-in-out infinite; }
  @keyframes wave { 0%,100% { transform: scaleY(.45); } 50% { transform: scaleY(1); } }
</style>
<rect x="1" y="1" width="478" height="214" rx="20" fill="url(#bg)" stroke="#2E2448"/>
<rect x="1" y="1" width="478" height="214" rx="20" fill="url(#dots)"/>
<rect x="1" y="1" width="478" height="214" rx="20" fill="url(#glow)"/>

<rect x="28" y="28" width="52" height="52" rx="14" fill="#E35D6A" fill-opacity="0.16" stroke="#E35D6A" stroke-opacity="0.55"/>
<path d="M36 55 h9 l4 -11 l6 22 l5 -14 l3 3 h11" fill="none" stroke="#E35D6A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="98" y="47" font-size="11.5" font-weight="700" letter-spacing="1.5" fill="#E35D6A">HARDWARE  ·  SAFETY</text>
<text x="98" y="75" font-size="25" font-weight="700" fill="#F4F0FF">Telemetry Pro</text>
<text x="452" y="48" font-size="18" text-anchor="end" fill="#8D84A8">&#8599;</text>
<text x="28" y="120" font-size="15" fill="#B7AFCB">A vehicle system that detects crashes and</text>
<text x="28" y="143" font-size="15" fill="#B7AFCB">automatically alerts hospitals and ambulances.</text>
<rect x="28" y="164" width="222" height="28" rx="14" fill="#1B1528" stroke="#2E2448"/>
<circle cx="45" cy="178" r="4.5" fill="#8D84A8"/>
<text x="58" y="183" font-size="12.5" font-weight="600" letter-spacing="0.5" fill="#D8CCF2">PROJECT  ·  code on GitHub</text>
</svg>
