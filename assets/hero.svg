x="2" fill="#9B7BD0" style="animation-delay:1.44s"/><rect class="bar" x="808" y="90" width="4" height="12" rx="2" fill="#9B7BD0" style="animation-delay:1.52s"/><rect class="bar" x="816" y="86" width="4" height="20" rx="2" fill="#9B7BD0" style="animation-delay:1.60s"/><rect class="bar" x="824" y="88" width="4" height="16" rx="2" fill="#9B7BD0" style="animation-delay:1.68s"/><rect class="bar" x="832" y="84" width="4" height="24" rx="2" fill="#9B7BD0" style="animation-delay:1.76s"/><rect class="bar" x="840" y="91" width="4" height="10" rx="2" fill="#9B7BD0" style="animation-delay:1.84s"/>

<g class="m m1"><rect x="652" y="122" width="228" height="32" rx="10" fill="#262C38"/>
<text x="665" y="143" font-size="13.5" fill="#E6E9F0">Hi, I'd like a bin for Friday.</text></g>

<g class="m typing"><rect x="886" y="164" width="58" height="30" rx="10" fill="#5A4590"/>
<circle class="dot" cx="902" cy="179" r="3.2" fill="#fff"/><circle class="dot" cx="915" cy="179" r="3.2" fill="#fff" style="animation-delay:.15s"/><circle class="dot" cx="928" cy="179" r="3.2" fill="#fff" style="animation-delay:.3s"/></g>

<g class="m m2"><rect x="680" y="164" width="264" height="32" rx="10" fill="url(#agent)"/>
<text x="693" y="185" font-size="13.5" fill="#fff">Sure. What will you be throwing out?</text></g>

<g class="m m3"><rect x="652" y="206" width="236" height="32" rx="10" fill="#262C38"/>
<text x="665" y="227" font-size="13.5" fill="#E6E9F0">Old furniture and some drywall.</text></g>

<g class="m m4"><rect x="652" y="252" width="292" height="34" rx="9" fill="#10261F" stroke="#2B6B50"/>
<path d="M667 269 l4.5 4.5 l9 -10" fill="none" stroke="#4ADE80" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="689" y="274" font-size="12.5" fill="#8FE3B9">Order sent, team notified by text</text></g>
</svg>
