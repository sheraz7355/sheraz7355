<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Muhammad Sheraz. Software engineer, AI agents and automation.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#151922"/><stop offset="1" stop-color="#10131A"/></linearGradient>
  <linearGradient id="agent" x1="0" x2="1"><stop offset="0" stop-color="#6E4FA8"/><stop offset="1" stop-color="#8462B8"/></linearGradient>
</defs>
<style>
  text { font-family: 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; }
  .blink { animation: blink 1.8s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  
  .bar { transform-box: fill-box; transform-origin: center; animation: wave 1.1s ease-in-out infinite; }
  @keyframes wave { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
  .m { opacity: 0; animation-duration: 12s; animation-iteration-count: infinite; animation-timing-function: ease-out; }
  .m1 { animation-name: m1; } .m2 { animation-name: m2; } .m3 { animation-name: m3; } .m4 { animation-name: m4; } .typing { animation-name: ty; }
  @keyframes m1 { 0%,3% { opacity: 0; transform: translateY(6px); } 8%,90% { opacity: 1; transform: translateY(0); } 96%,100% { opacity: 0; } }
  @keyframes ty { 0%,11% { opacity: 0; } 13%,24% { opacity: 1; } 26%,100% { opacity: 0; } }
  @keyframes m2 { 0%,24% { opacity: 0; transform: translateY(6px); } 29%,90% { opacity: 1; transform: translateY(0); } 96%,100% { opacity: 0; } }
  @keyframes m3 { 0%,42% { opacity: 0; transform: translateY(6px); } 47%,90% { opacity: 1; transform: translateY(0); } 96%,100% { opacity: 0; } }
  @keyframes m4 { 0%,60% { opacity: 0; transform: translateY(6px); } 66%,90% { opacity: 1; transform: translateY(0); } 96%,100% { opacity: 0; } }
  .dot { animation: hop 1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes hop { 0%,60%,100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-3px); opacity: 1; } }
</style>
<rect x="0.5" y="0.5" width="999" height="339" rx="14" fill="url(#bg)" stroke="#2A303C"/>

<text x="48" y="70" font-size="12.5" font-weight="600" letter-spacing="2.5" fill="#A99BD0">SOFTWARE ENGINEER  ·  AI AGENTS &amp; AUTOMATION</text>
<text x="48" y="122" font-size="44" font-weight="700" fill="#F2F4F8">Muhammad Sheraz</text>
<text x="48" y="166" font-size="18" fill="#B4BAC6">I build AI agents and automations that handle</text>
<text x="48" y="192" font-size="18" fill="#B4BAC6">customer conversations and operations work.</text>
<rect x="48" y="232" width="172" height="70" rx="10" fill="#191E28" stroke="#2A303C"/>
<text x="64" y="263" font-size="24" font-weight="700" fill="#F2F4F8">3</text>
<text x="64" y="287" font-size="12" fill="#8B93A3">businesses in production</text><rect x="230" y="232" width="172" height="70" rx="10" fill="#191E28" stroke="#2A303C"/>
<text x="246" y="263" font-size="24" font-weight="700" fill="#F2F4F8">3</text>
<text x="246" y="287" font-size="12" fill="#8B93A3">channels: call, chat, text</text><rect x="412" y="232" width="172" height="70" rx="10" fill="#191E28" stroke="#2A303C"/>
<text x="428" y="263" font-size="24" font-weight="700" fill="#F2F4F8">24/7</text>
<text x="428" y="287" font-size="12" fill="#8B93A3">always answering</text>

<rect x="632" y="36" width="332" height="268" rx="12" fill="#191E28" stroke="#2A303C"/>
<circle class="blink" cx="656" cy="62" r="4.5" fill="#FF5C7A"/>
<text x="669" y="67" font-size="11.5" font-weight="700" letter-spacing="1.8" fill="#FFB3C1">LIVE CALL</text>
<text x="944" y="67" font-size="11.5" text-anchor="end" fill="#8B93A3">AI agent</text>
