<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 268" width="1000" height="268" role="img" aria-label="Customer calls, chats or texts; the AI agent answers and takes the order; systems are updated; the team gets a summary.">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171127"/><stop offset="1" stop-color="#0B0912"/></linearGradient>
  <radialGradient id="glow" cx="0.85" cy="0.05" r="0.75"><stop offset="0" stop-color="#9B7BD0" stop-opacity="0.42"/><stop offset="1" stop-color="#9B7BD0" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#fff" opacity="0.055"/></pattern>
  <linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#EBDDFF"/><stop offset="1" stop-color="#9B7BD0"/></linearGradient>
  <linearGradient id="agent" x1="0" x2="1"><stop offset="0" stop-color="#6E47A6"/><stop offset="1" stop-color="#8F63A7"/></linearGradient>
</defs>
<style>
  text { font-family: 'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; }
  .blink { animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  
  .pulse { animation: pulse 2.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: .35; } }
</style>
<rect x="1" y="1" width="998" height="266" rx="20" fill="url(#bg)" stroke="#2E2448"/>
<rect x="1" y="1" width="998" height="266" rx="20" fill="url(#dots)"/>
<rect x="1" y="1" width="998" height="266" rx="20" fill="url(#glow)"/>

